<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#06121e"/>
    </linearGradient>
    <radialGradient id="glow" cx="85%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="emGrad" x1="120" y1="120" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="55%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>

  <!-- Obsidian Squircle Base -->
  <rect width="512" height="512" rx="124" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="124" fill="url(#glow)"/>
  <rect x="6" y="6" width="500" height="500" rx="118" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="8"/>

  <!-- Geometric Isometric V / Crate + Checkmark -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top diamond / crate roof -->
    <path d="M256 108 L392 178 L256 248 L120 178 Z" fill="url(#emGrad)" fill-opacity="0.18" stroke="url(#emGrad)" stroke-width="26"/>
    <!-- Left & Right V walls -->
    <path d="M120 178 L120 318 L256 396 L392 318 L392 178" stroke="url(#emGrad)" stroke-width="26"/>
    <!-- Center spine -->
    <path d="M256 248 L256 396" stroke="#34d399" stroke-width="22" stroke-opacity="0.7"/>
    <!-- Crisp white verification check badge -->
    <circle cx="372" cy="364" r="64" fill="#0b1120" stroke="#10b981" stroke-width="18"/>
    <path d="M344 364 L364 384 L402 344" stroke="#ffffff" stroke-width="22"/>
  </g>
</svg>
